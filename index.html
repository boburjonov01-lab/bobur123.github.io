<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bo‘ri rasmi</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 40px;
    }

    button {
      padding: 14px 25px;
      margin: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    canvas {
      margin-top: 20px;
      max-width: 90%;
      background: white;
      border-radius: 15px;
      box-shadow: 0 0 20px #000;
    }
  </style>
</head>

<body>

  <h1>🐺 Bo‘ri rasmi chizuvchi sayt</h1>

  <p>Quyidagi tugmani bosib bo‘ri rasmini hosil qil.</p>

  <button onclick="chiz()">🐺 Bo‘ri chizish</button>

  <br>

  <canvas id="canvas" width="500" height="500"></canvas>

  <script>
    function chiz() {
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      ctx.clearRect(0, 0, 500, 500);

      // Fon
      ctx.fillStyle = "#dbeafe";
      ctx.fillRect(0, 0, 500, 500);

      // Quloqlar
      ctx.fillStyle = "#4b5563";

      ctx.beginPath();
      ctx.moveTo(150, 180);
      ctx.lineTo(190, 70);
      ctx.lineTo(240, 150);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(260, 150);
      ctx.lineTo(310, 70);
      ctx.lineTo(350, 180);
      ctx.closePath();
      ctx.fill();

      // Bosh
      ctx.fillStyle = "#6b7280";

      ctx.beginPath();
      ctx.arc(250, 250, 130, 0, Math.PI * 2);
      ctx.fill();

      // Oq yuz qismi
      ctx.fillStyle = "#f3f4f6";

      ctx.beginPath();
      ctx.moveTo(170, 270);
      ctx.lineTo(250, 370);
      ctx.lineTo(330, 270);
      ctx.lineTo(300, 240);
      ctx.lineTo(200, 240);
      ctx.closePath();
      ctx.fill();

      // Ko‘zlar
      ctx.fillStyle = "black";

      ctx.beginPath();
      ctx.arc(205, 230, 15, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(295, 230, 15, 0, Math.PI * 2);
      ctx.fill();

      // Burun
      ctx.beginPath();
      ctx.moveTo(230, 290);
      ctx.lineTo(250, 275);
      ctx.lineTo(270, 290);
      ctx.lineTo(250, 310);
      ctx.closePath();
      ctx.fill();

      // Og‘iz
      ctx.beginPath();
      ctx.moveTo(250, 310);
      ctx.lineTo(250, 340);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(225, 335, 25, 0, Math.PI);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(275, 335, 25, 0, Math.PI);
      ctx.stroke();
    }
  </script>

</body>
</html>
